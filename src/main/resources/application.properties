spring.application.name=mydata-ai-platform

platform.llm.base-url=${PRIVATE_LLM_BASE_URL:}
platform.llm.path=${PRIVATE_LLM_PATH:/v1/chat/completions}
platform.llm.model=${PRIVATE_LLM_MODEL:}
platform.llm.api-key=${PRIVATE_LLM_API_KEY:}
platform.llm.connect-timeout=${PRIVATE_LLM_CONNECT_TIMEOUT:3s}
platform.llm.read-timeout=${PRIVATE_LLM_READ_TIMEOUT:30s}
platform.llm.max-output-tokens=${PRIVATE_LLM_MAX_OUTPUT_TOKENS:4096}
